name: pull_request

on: [pull_request]

jobs:
  helm-lint:
    name: Run Helm lint Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Helm Lint Checks
        # TODO: switch to the helm-lint release tag once MapColonies/shared-workflows#115 is released.
        uses: MapColonies/shared-workflows/actions/helm-lint@17b1521b3bba26d44cda363ebdceb3addf7154b2
        with:
          registry: ${{ secrets.ACR_URL }}
          username: ${{ secrets.ACR_PUSH_USER }}
          password: ${{ secrets.ACR_PUSH_TOKEN }}
