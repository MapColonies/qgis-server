{{- if not .Values.s3.secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "qgis-server.secretName" . }}
  labels:
{{- include "qgis-server.labels" . | nindent 4 }}
type: Opaque
data:
  accessKeyId: {{ .Values.s3.accessKeyId | b64enc | quote }}
  secretAccessKey: {{ .Values.s3.secretAccessKey | b64enc | quote }}
{{- end }}
